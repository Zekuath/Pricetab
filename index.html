<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cryptocurrency Price Chart</title>
    <link rel="stylesheet" href="./vendor/normalize.min.css" />
    <link rel="stylesheet" href="./vendor/roboto-mono.css" />
    <style>
      /* Prevent white flash on load — matches system theme before React mounts */
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
      }

      @media (prefers-color-scheme: light) {
        body {
          background-color: #ffffff;
          color: #1a1a1a;
        }
      }

      @media (max-width: 600px) {
        .overview-wrapper {
          flex-direction: column;
          align-items: center;
          gap: 1rem;
          padding: 1rem;
        }
        .period-button {
          font-size: 0.8rem;
          width: 2.5rem;
          height: 2.5rem;
        }
        .value-text {
          font-size: 1.25rem;
        }
        .label-text {
          font-size: 0.625rem;
        }
        svg {
          width: 100% !important;
          height: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="./src/theme-init.js"></script>
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/styled-components.min.js"></script>
    <script src="./vendor/d3-custom.min.js"></script>
    <script src="./vendor/d3-interpolate-path.min.js"></script>
    <script src="./src/theme.js"></script>
    <script src="./src/icons.js"></script>
    <script src="./src/api.js"></script>
    <script src="./src/config.js"></script>
    <script src="./src/storage.js"></script>
    <script src="./src/widgets-data.js"></script>
    <script src="./src/utils.js"></script>
    <script src="./src/chart.js"></script>
    <script src="./src/styles-app.js"></script>
    <script src="./src/styles-widgets.js"></script>
    <script src="./src/styles-settings.js"></script>
    <script src="./src/settings-preferences.js"></script>
    <script src="./src/settings.js"></script>
    <script src="./src/onboarding.js"></script>
    <script src="./src/portfolio.js"></script>
    <script src="./src/quickswitch.js"></script>
    <script src="./src/alerts.js"></script>
    <script src="./src/shortcuts.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
