<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The phone's own bar in the page's ground, in either theme -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Cryptocurrency Price Chart</title>
    <link rel="stylesheet" href="./vendor/normalize.min.css" />
    <link rel="stylesheet" href="./vendor/roboto-mono.css" />
    <style>
      /* Prevent white flash on load — matches system theme before React mounts */
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
      }

      @media (prefers-color-scheme: light) {
        body {
          background-color: #ffffff;
          color: #1a1a1a;
        }
      }

      /* A phone block lived here: four rules for class names nothing in
         src/ has carried since the first template (.overview-wrapper,
         .period-button, .value-text, .label-text), and every svg forced to
         width: 100% / height: auto. The last one was not dead — it blew up
         every icon without a CSS size to its container's width (the
         portfolio's "Explore chart" eye came out 104px square on a 420px
         phone) and squashed stretched charts into squares of their width —
         and it did nothing for the main chart, which sizes itself (420×601
         with it and without). Removed 28 Sep 2026; each phone screen's svgs
         were measured before and after. */
    </style>
  </head>
  <body>
    <script src="./src/theme-init.js"></script>
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/styled-components.min.js"></script>
    <script src="./vendor/d3-custom.min.js"></script>
    <script src="./vendor/d3-interpolate-path.min.js"></script>
    <script src="./src/theme.js"></script>
    <script src="./src/icons.js"></script>
    <script src="./src/api.js"></script>
    <script src="./src/storage.js"></script>
    <!-- Language sits between storage.js and config.js, and both halves of that
         are load-order facts: it reads its own setting through storage.js, and
         config.js builds translated option labels while it runs, so msg() has
         to exist before config.js is read. -->
    <script src="./src/i18n.js"></script>
    <script src="./src/config.js"></script>
    <script src="./src/widgets-data.js"></script>
    <!-- The bundled OFAC address list. Data, no dependencies of its own;
         generated by scripts/build-sanctions.js and read only when a watched
         address is checked. -->
    <script src="./src/sanctions.js"></script>
    <script src="./src/utils.js"></script>
    <script src="./src/outlook.js"></script>
    <script src="./src/regime-grid.js"></script>
    <script src="./src/cell-odds.js"></script>
    <script src="./src/outlook-model.js"></script>
    <script src="./src/model-outlook.js"></script>
    <script src="./src/chart-board.js"></script>
    <script src="./src/chart-axes.js"></script>
    <script src="./src/chart-tools.js"></script>
    <script src="./src/chart-studies.js"></script>
    <script src="./src/chart-odds.js"></script>
    <script src="./src/chart.js"></script>
    <script src="./src/chart-controls.js"></script>
    <script src="./src/chart-image.js"></script>
    <!-- The chart's window in time: zoom, pan and the finer candles a
         narrow window asks for. Wraps the chart; loads after it. -->
    <script src="./src/chart-viewport.js"></script>
    <script src="./src/styles-app.js"></script>
    <script src="./src/styles-widgets.js"></script>
    <script src="./src/styles-settings.js"></script>
    <script src="./src/settings-preferences.js"></script>
    <!-- The Permissions tab: a plain function like the Preferences one, read
         by settings.js at render. Asks Chrome through helpers that live in
         notify.js and news.js, which load later — runtime calls only. -->
    <script src="./src/settings-permissions.js"></script>
    <script src="./src/settings.js"></script>
    <!-- The chart's own settings, in a drawer beside it. Renders the section
         builders from settings-preferences.js, so it loads after them and
         after the styles that give it its box. -->
    <script src="./src/chart-settings.js"></script>
    <script src="./src/onboarding.js"></script>
    <script src="./src/portfolio-chart.js"></script>
    <script src="./src/styles-portfolio.js"></script>
    <!-- A different chart grammar from portfolio-chart.js: ranked bars, no
         crosshair. Loads after it and before portfolio.js, which renders it. -->
    <script src="./src/portfolio-contribution.js"></script>
    <!-- The tax report helper: four countries' rules applied to the
         portfolio's records (pure; the portfolio renders it). -->
    <!-- The world's crypto tax rules as data (loads before the engine). -->
    <script src="./src/tax-world.js"></script>
    <script src="./src/tax-report.js"></script>
    <!-- The portfolio's ledger views: one holding in detail, the activity,
         the return by month and the tax helper's screen (attached to the
         portfolio, so it loads before it). -->
    <script src="./src/portfolio-ledger.js"></script>
    <!-- The tax guide: every country's rules, what is and is not taxed, and
         the estimate (attached to the portfolio, so it loads before it). -->
    <script src="./src/tax-guide.js"></script>
    <script src="./src/portfolio.js"></script>
    <script src="./src/quickswitch.js"></script>
    <!-- Practice positions: the pure model, then the styles the calls panel
         renders them with. Both load before alerts.js, which draws them. -->
    <script src="./src/practice-math.js"></script>
    <script src="./src/practice-model.js"></script>
    <script src="./src/assistant.js"></script>
    <script src="./src/styles-practice.js"></script>
    <script src="./src/notify.js"></script>
    <script src="./src/styles-alerts.js"></script>
    <!-- The derivatives market, cut out of alerts.js on 13 Sep 2026. A factory
         called from the panel's constructor, so strictly the order does not
         matter — but a file that is read by another reads before it. -->
    <script src="./src/alerts-futures.js"></script>
    <script src="./src/practice-page.js"></script>
    <script src="./src/alerts.js"></script>
    <script src="./src/styles-news.js"></script>
    <script src="./src/news-reader.js"></script>
    <script src="./src/news-preview.js"></script>
    <script src="./src/news.js"></script>
    <!-- The candlestick shapes and what followed them, as states the
         base-rate panel can count. Pure; loaded before the panel. -->
    <script src="./src/candle-patterns.js"></script>
    <script src="./src/price-patterns.js"></script>
    <script src="./src/strategy-setups.js"></script>
    <script src="./src/swing-patterns.js"></script>
    <script src="./src/companion-readings.js"></script>
    <script src="./src/styles-baserates.js"></script>
    <script src="./src/baserates.js"></script>
    <script src="./src/shortcuts.js"></script>
    <script src="./src/compare-drawer.js"></script>
    <script src="./src/app-portfolio.js"></script>
    <script src="./src/app-calls.js"></script>
    <script src="./src/app-alerts.js"></script>
    <script src="./src/app-news.js"></script>
    <script src="./src/app-ticker.js"></script>
    <script src="./src/app-view.js"></script>
    <script src="./src/app-tools.js"></script>
    <script src="./src/app-widgets.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
