# PriceTab for iPhone — the Xcode project, described here and generated by
# XcodeGen (`xcodegen generate`). The .xcodeproj is a build artefact and is
# not tracked; this file is the source of truth. See README.md.
name: PriceTab
options:
  bundleIdPrefix: com.pricetab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Automatic signing: pick your team once in Xcode (Signing & Capabilities)
    # or put its ten-character ID here. An empty value builds for the
    # simulator without signing and refuses a device until it is set.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  PriceTab:
    type: application
    platform: iOS
    sources:
      - path: PriceTab
      - path: Shared
      # The web app, copied here by scripts/build-webapp.sh, shipped as a
      # folder so paths inside it stay as they are (index.html loads
      # ./src/… and ./vendor/…).
      - path: WebApp
        type: folder
        buildPhase: resources
    info:
      path: PriceTab/Info.plist
      properties:
        CFBundleDisplayName: PriceTab
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: PriceTab/PriceTab.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pricetab.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pricetab.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: PriceTabWidget
        embed: true
        codeSign: true

  PriceTabWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PriceTabWidget
      - path: Shared
    info:
      path: PriceTabWidget/Info.plist
      properties:
        CFBundleDisplayName: PriceTab
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PriceTabWidget/PriceTabWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pricetab.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pricetab.app.widget
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

schemes:
  PriceTab:
    build:
      targets:
        PriceTab: all
        PriceTabWidget: all
    run:
      config: Debug
    archive:
      config: Release
