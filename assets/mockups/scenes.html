<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PriceTab — Raw Screenshot Scenes</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  iframe { display: block; width: 1280px; height: 800px; border: 0; }
</style>
</head>
<body>
<script>
  // Boots the real extension page (../../index.html) with a per-scene
  // localStorage state, then performs the scene's clicks inside the iframe.
  //
  // Usage:  scenes.html?scene=<name>&theme=dark|light&delay=12000
  // Scenes: dashboard, wl-movers, signals, news, presets,
  //         settings-coins, settings-prefs, minimal,
  //         hero, compare, portfolio, widgets, widget-row, targets,
  //         candles, grid  (1.4.0)
  //
  // Serve the repo over http (tests/… or any static server with a /__delay
  // endpoint) and screenshot with plain real-time headless Chrome:
  //   chrome --headless --window-size=1280,800 --timeout=60000
  //          --screenshot=raw/<scene>.png
  //          "http://localhost:8123/assets/mockups/scenes.html?scene=<scene>&delay=12000"
  // The &delay=N img below stalls the page load event for N ms, so the
  // screenshot fires only after live data + animations have settled.
  const COINS = ["BTC", "ETH", "SOL", "XRP", "DOGE", "ADA", "AVAX", "LINK"];

  const W = (on) => {
    const all = ["watchlist","topMovers","fearGreed","marketOverview","halvingCountdown",
                 "rsiWidget","fundingRate","longShortRatio","openInterest","liquidations","altcoinSeason"];
    const out = {};
    all.forEach((k) => { out[k] = on.includes(k) || on === "all"; });
    return JSON.stringify(out);
  };


  // Seeded state for the 1.4.0 scenes. Dated relative to capture time so the
  // holding periods and "hit 2h ago" stay right whenever this is re-run.
  const DAY = 86400;
  const ago = (days) => Math.floor(Date.now() / 1000) - days * DAY;

  /* A portfolio that is honest rather than flattering (SCREENSHOT_PLAN D1):
   * up overall (~+12%) with one clearly red row, so the sort control visibly
   * does something and the colour system is legible. The paid figures were
   * worked back from live prices at seeding time — picked by eye they came
   * out net negative, which is the opposite of the brief. One small old sale
   * gives Realized something to show without reading as trading activity.
   * Re-check these if prices move far: the target is up, not up a lot. */
  const PORTFOLIO = [
    {
      coin: "BTC", amount: 0.42, watches: [],
      lots: [{ amount: 0.42, paid: 24000, time: ago(430), source: "manual" }],
      sales: [],
    },
    {
      coin: "ETH", amount: 3.1, watches: [],
      lots: [{ amount: 3.1, paid: 5400, time: ago(295), source: "manual" }],
      sales: [],
    },
    {
      coin: "SOL", amount: 24, watches: [],
      lots: [{ amount: 24, paid: 1500, time: ago(150), source: "manual" }],
      // The one recorded sale — small, and old enough to read as history
      sales: [{
        amount: 6, received: 460, basis: 375, basisAmount: 6, time: ago(38),
        matched: [{ amount: 6, cost: 375, acquired: ago(150), source: "manual" }],
      }],
    },
    {
      coin: "LINK", amount: 90, watches: [],
      lots: [{ amount: 90, paid: 700, time: ago(88), source: "manual" }],
      sales: [],
    },
    {
      // The red row
      coin: "DOGE", amount: 12000, watches: [],
      lots: [{ amount: 12000, paid: 1150, time: ago(210), source: "manual" }],
      sales: [],
    },
  ];

  /* Three armed and one already hit, so the panel shows both of its sections,
   * a percent target, and progress meters part-way along.
   *
   * Every number is set against the live price at seeding time. Picked by eye
   * they misfired: a "SOL below 120" against a $76 coin fired the moment the
   * page loaded, which put a toast over the header and moved a target into
   * the wrong section. Targets sit ~5-9% out — near enough to be plausible,
   * far enough not to trigger. Re-check if prices move a long way.
   *
   * Note the unit: alerts timestamp in **milliseconds** (`created`,
   * `triggeredAt` are `Date.now()`), while lots and sales use **seconds**.
   * Seeding an alert with `ago()` made a three-hour-old hit render as "a
   * month ago", so alerts get their own helper. */
  const agoMs = (hours) => Date.now() - hours * 3600000;
  const ALERTS = [
    { id: "a1", coin: "BTC", kind: "price", direction: "above", target: 68000,
      currency: "USD", created: agoMs(24 * 9), startPrice: 62000,
      triggeredAt: null, hitPrice: null },
    { id: "a2", coin: "ETH", kind: "percent", direction: "below", target: 5,
      currency: "USD", created: agoMs(24 * 4), startPrice: null,
      triggeredAt: null, hitPrice: null },
    { id: "a3", coin: "SOL", kind: "price", direction: "below", target: 70,
      currency: "USD", created: agoMs(24 * 2), startPrice: 82,
      triggeredAt: null, hitPrice: null },
    // The hit one: crossed a few hours ago and is still near the line
    { id: "a4", coin: "LINK", kind: "price", direction: "above", target: 8.2,
      currency: "USD", created: agoMs(24 * 6), startPrice: 7.4,
      triggeredAt: agoMs(3), hitPrice: 8.24 },
  ];

  const SCENES = {
    dashboard: {
      store: {
        crypto_chart_widgets: W(["watchlist", "fearGreed", "marketOverview", "halvingCountdown"]),
        crypto_chart_page_ticker_enabled: "true",
      },
      clicks: [{ at: 4000, button: "1W" }],
    },
    "wl-movers": {
      store: {
        crypto_chart_widgets: W(["watchlist", "topMovers", "fearGreed"]),
        crypto_chart_page_ticker_enabled: "true",
      },
      clicks: [{ at: 4000, button: "1W" }],
    },
    signals: {
      store: {
        crypto_chart_widgets: W("all"),
        crypto_chart_page_ticker_enabled: "true",
      },
      clicks: [],
    },
    news: {
      store: {
        crypto_chart_widgets: W(["watchlist", "fearGreed", "marketOverview"]),
        crypto_chart_page_ticker_enabled: "true",
        crypto_chart_news_ticker_enabled: "true",
      },
      clicks: [{ at: 4000, button: "1W" }],
    },
    "settings-coins": {
      store: {
        crypto_chart_widgets: W(["watchlist", "fearGreed", "marketOverview"]),
        crypto_chart_page_ticker_enabled: "false",
      },
      clicks: [{ at: 3000, selector: '[aria-label="Open settings"]' }],
    },
    "settings-prefs": {
      store: {
        crypto_chart_widgets: W(["watchlist", "fearGreed", "marketOverview"]),
        crypto_chart_page_ticker_enabled: "false",
      },
      clicks: [
        { at: 3000, selector: '[aria-label="Open settings"]' },
        { at: 4000, button: "Preferences" },
      ],
    },
    presets: {
      store: {
        // Holder preset active → its button shows highlighted in the panel
        crypto_chart_widgets: W(["watchlist", "topMovers", "fearGreed", "marketOverview", "altcoinSeason"]),
        crypto_chart_page_ticker_enabled: "false",
      },
      clicks: [
        { at: 3000, selector: '[aria-label="Open settings"]' },
        { at: 4000, button: "Widgets" },
      ],
    },
    minimal: {
      store: {
        crypto_chart_widgets: W([]),
        crypto_chart_page_ticker_enabled: "false",
      },
      clicks: [{ at: 4000, button: "ALL" }],
    },

    /* ── 1.4.0 store scenes (see docs/store/SCREENSHOT_PLAN.md §4) ── */

    // F1 — the hero. Near-default: the four coins that ship, one chart,
    // nothing switched on. What an install actually looks like.
    hero: {
      store: {
        crypto_chart_coin_options: JSON.stringify(["BTC", "ETH", "XRP", "LTC"]),
        crypto_chart_widgets: W([]),
        crypto_chart_page_ticker_enabled: "false",
      },
      /* 1M rather than the set's 1W, and the reason is the *frame*, not the
       * chart. The hero composite shows only the top of the capture — the
       * browser mock is 1020px wide and the band beneath the wordmark cuts it
       * at about 430px — so whatever the line does in the lower half of the
       * page is not in the picture. A week that sat flat and then spiked left
       * the hero looking like an empty chart with a tick in the corner. A
       * month climbs across the crop instead. Re-check this when re-shooting:
       * the right range is whichever one puts the line where the frame can
       * see it. */
      clicks: [{ at: 4000, button: "1D" }],
    },

    // F2 — compare. "C" opens the picker, then ETH is chosen from it.
    compare: {
      store: {
        crypto_chart_widgets: W([]),
        crypto_chart_page_ticker_enabled: "false",
      },
      /* 1M, not the 1W the rest of the set uses. The house rule is one range
       * everywhere, but this frame's whole subject is divergence, and over a
       * week BTC and ETH routinely land within a tenth of a percent of each
       * other — two lines on top of each other demonstrate nothing at
       * thumbnail size. A year separates them too (-45% vs -55%) but reads as
       * a wall of loss; a month is where they part company while both series
       * still straddle the zero line the shared axis is measured from. */
      clicks: [
        { at: 4000, button: "1M" },
        // The compare button opens the same picker "C" does
        { at: 6000, selector: '[data-tour="compare"]' },
        { at: 7500, contains: "Ethereum" },
      ],
    },

    // F3 — portfolio. Opened from the briefcase; the seeded holdings give it
    // a cost-basis line, per-row sparklines and a Realized figure.
    portfolio: {
      store: {
        crypto_chart_widgets: W([]),
        crypto_chart_page_ticker_enabled: "false",
        crypto_chart_portfolio: JSON.stringify(PORTFOLIO),
        /* A month. The cost-basis line only draws while the level is inside
         * the range on screen — by design, since a line pinned to an edge
         * would claim a crossing the window doesn't contain — and a portfolio
         * that hasn't been under water lately has its cost off the bottom of
         * a short range. A year does show the line, but it puts −49% at the
         * top of the frame and turns every sparkline red, which is a worse
         * screenshot than one missing a dashed line. The year capture is kept
         * for the website, where there is room to explain it. */
        crypto_chart_portfolio_period: "month",
        crypto_chart_portfolio_sort: "value",
      },
      clicks: [{ at: 3500, selector: '[data-tour="portfolio"]' }],
    },

    /* F4 — widgets, two candidates.
     *
     * `widgets` opens Settings, which turns out to bury the thing it is about:
     * the overlay dims the page so hard that the widget row behind it is a
     * ghost. Same lesson as the targets panel — an overlay takes the screen on
     * purpose. `widget-row` is the alternative: the row itself, no panel.
     * Decide from the captures, keep the loser for the website. */
    "widget-row": {
      store: {
        crypto_chart_widgets: W(["watchlist", "fearGreed", "marketOverview", "halvingCountdown", "altcoinSeason"]),
        crypto_chart_page_ticker_enabled: "false",
      },
      clicks: [{ at: 4000, button: "1W" }],
    },

    widgets: {
      store: {
        crypto_chart_widgets: W(["watchlist", "fearGreed", "marketOverview", "halvingCountdown", "altcoinSeason"]),
        crypto_chart_page_ticker_enabled: "false",
      },
      clicks: [
        { at: 3500, selector: '[data-tour="settings"]' },
        { at: 4500, button: "Widgets" },
      ],
    },

    // F5 — price targets, light theme. Three armed + one hit, so both
    // sections of the panel show.
    targets: {
      store: {
        crypto_chart_widgets: W([]),
        crypto_chart_page_ticker_enabled: "false",
        crypto_chart_alerts: JSON.stringify(ALERTS),
      },
      clicks: [{ at: 3500, selector: '[data-tour="alerts"]' }],
    },

    // The price/time grid, on the range where its levels are most legible
    grid: {
      store: {
        crypto_chart_widgets: W([]),
        crypto_chart_page_ticker_enabled: "false",
        crypto_chart_grid: "true",
      },
      clicks: [{ at: 4000, button: "1M" }],
    },

    /* Calls — the board, with a column that is contested.
     *
     * Rewritten for 1.4.0: the old scene set `crypto_chart_predict_ahead`, a
     * key that no longer exists (the board's width is dragged now and stored
     * as `crypto_chart_future_share`), and its bands were written when BTC was
     * in the low sixties, so they sat off the window entirely.
     *
     * The bands are placed against the range actually on screen, and two open
     * calls share one column so the `CALLED · 1ST` mark has something to be
     * first *of* — a lone call never carries it, so a frame without a
     * contested column cannot show the feature at all. One settled hit and one
     * settled miss sit behind them: a board showing only wins is not the
     * honest picture.
     */
    calls: {
      store: {
        crypto_chart_widgets: W([]),
        crypto_chart_page_ticker_enabled: "false",
        crypto_chart_predict: "true",
        // A third of the width is board — enough squares to point at without
        // pushing the day's shape off the screen
        crypto_chart_future_share: "0.32",
        /* One notch out. At the default the window is about $7.7K and
         * this day spans $5.9K, which fits — but only just, so the low
         * sits on the window's floor and the line clips at the left edge.
         * That is the board behaving exactly as designed, and in a still
         * image it reads as a rendering fault. */
        crypto_chart_board_zoom_day: "2",
        crypto_chart_calls: (() => {
          const H = 3600000;
          // Aligned to the lattice, which counts whole hours off the clock
          const hour = Math.floor(Date.now() / H) * H;
          const call = (id, at, lo, hi, placedH) => ({
            id, coin: "BTC", currency: "USD", period: "day",
            target: hour + at * H, span: H, lo, hi,
            placed: Date.now() - placedH * H, placedPrice: 68800,
          });
          return JSON.stringify({
            record: { hits: 4, total: 7, streak: 2, best: 3 },
            open: [
              // One column, two bands: the claim and the hedge above it
              call("c1", 2, 68000, 70000, 5),
              call("c2", 2, 66000, 68000, 2),
              call("c3", 4, 67000, 69000, 3),
            ],
            done: [
              { id: "d1", coin: "BTC", currency: "USD", period: "day",
                target: hour - 4 * H, span: H, lo: 67000, hi: 69000,
                placed: Date.now() - 11 * H, placedPrice: 67400,
                result: "hit", settledPrice: 68610, settledAt: Date.now() - 4 * H },
              { id: "d2", coin: "BTC", currency: "USD", period: "day",
                target: hour - 7 * H, span: H, lo: 63000, hi: 65000,
                placed: Date.now() - 15 * H, placedPrice: 65200,
                result: "miss", settledPrice: 66980, settledAt: Date.now() - 8 * H },
            ],
          });
        })(),
      },
      /* 1D, not the 1M the old scene used and not the set's 1W.
       *
       * With a board on, the price scale stops fitting the data and becomes a
       * window onto a fixed lattice — so a range whose span is wider than the
       * window keeps the live price on screen and lets the rest clip, by
       * design. Measured against live data: the month spans about $7.8K and
       * the window about $5.3K, which drew the whole month as a vertical spike
       * at the right-hand edge. The day spans ~$5.9K inside a ~$7.7K window,
       * so the line fills the chart and the boxes still land on whole squares.
       */
      clicks: [{ at: 4000, button: "1D" }],
    },

    "calls-panel": {
      store: {},
      clicks: [
        { at: 4000, button: "1M" },
        { at: 6000, selector: '[data-tour="calls"]' },
      ],
    },

    // Not in the store set (five is the cap) — for the website and socials
    candles: {
      store: {
        crypto_chart_widgets: W([]),
        crypto_chart_page_ticker_enabled: "false",
        crypto_chart_chart_type: "candles",
        crypto_chart_volume_bars: "true",
      },
      clicks: [{ at: 4000, button: "1M" }],
    },
  };

  SCENES["calls-panel"].store = SCENES.calls.store;

  const scene = SCENES[new URLSearchParams(location.search).get("scene")];
  if (!scene) {
    document.body.textContent = "unknown scene — use ?scene=" + Object.keys(SCENES).join("|");
    throw new Error("unknown scene");
  }

  localStorage.clear();
  const theme = new URLSearchParams(location.search).get("theme") || "dark";
  const store = Object.assign(
    {
      crypto_chart_coin_options: JSON.stringify(COINS),
      crypto_chart_theme: theme,
      crypto_chart_currency: "USD",
      crypto_chart_rate_prompt_dismissed: "true",
      // Without this the first-run tour fires 600 ms in and every capture
      // lands with a dimmed backdrop and a tour card over the UI. This file
      // predates the tour; the rating card was already handled.
      crypto_chart_onboarding_seen: "1",
      // 5 min — no refresh fires between initial load and the screenshot,
      // so the price count-up animation can't be caught mid-roll
      crypto_chart_refresh_interval: "300000",
      crypto_chart_news_ticker_enabled: "false",
      crypto_chart_page_ticker_position: "top",
    },
    scene.store,
  );
  Object.entries(store).forEach(([k, v]) => localStorage.setItem(k, v));

  const delayMs = new URLSearchParams(location.search).get("delay");
  if (delayMs) {
    const blocker = new Image(); // holds the load event until /__delay responds
    blocker.src = "/__delay?ms=" + delayMs;
    blocker.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;";
    document.body.appendChild(blocker);
  }

  const frame = document.createElement("iframe");
  frame.src = "../../index.html";
  frame.addEventListener("load", () => {
    scene.clicks.forEach((click) => {
      setTimeout(() => {
        const doc = frame.contentDocument;
        if (!doc) return;
        /* Three ways to find a target, in order of precision:
         *   selector  — a real hook (data-tour=…, aria-label=…)
         *   button    — exact button text
         *   contains  — button text containing a string, for rows that have
         *               no hook of their own. Kept here rather than adding an
         *               attribute to the extension: this is capture-only
         *               machinery and shouldn't leak into the product. */
        const buttons = () => [...doc.querySelectorAll("button")];
        const el = click.selector
          ? doc.querySelector(click.selector)
          : click.contains
            ? buttons().find((b) => b.textContent.includes(click.contains))
            : buttons().find((b) => b.textContent.trim() === click.button);
        if (el) el.click();
      }, click.at);
    });
  });
  document.body.appendChild(frame);
</script>
</body>
</html>
