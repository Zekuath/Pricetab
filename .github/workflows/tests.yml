name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies (jsdom)
        run: npm install --prefix tests --no-audit --no-fund
      - name: Run test suite
        run: node tests/run-all.js
